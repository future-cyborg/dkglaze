version: "2"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/future-cyborg/udocker)

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gocritic
    - godot
    - godox
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - nlreturn
    - noctx
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - testpackage
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: "use the project logger instead"
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: false
    errorlint:
      errorf: true
    exhaustive:
      check-generated: false
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: fmt.Print.*
          msg: "avoid print statements, use a logger"
    funlen:
      lines: 60
      statements: 40
    gci:
      local-prefixes: github.com/future-cyborg/udocker
    gocognit:
      min-complexity: 15
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    godot:
      scope: declarations
      capital: false
    godox:
      keywords: []
    gofumpt:
      extra-rules: false
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    mnd:
      checks:
        - assign
        - case
        - operation
        - return
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 4
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
    revive:
      confidence: 0
      severity: error
      rules:
        - name: argument-limit
          arguments: [4]
        - name: atomic
        - name: bare-return
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: flag-parameter
        - name: function-length
          arguments: [21, 0]
        - name: function-result-limit
          arguments: [3]
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
        - name: line-length-limit
          arguments: [120]
        - name: max-public-structs
          arguments: [7]
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: range-val-address
        - name: range-val-in-closure
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unexported-return
        - name: unhandled-error
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unused-receiver
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value
    wrapcheck:
      ignoreSigs:
        - .Errorf(
        - .WithMessage(
        - .Wrap(
        - .Wrapf(
        - errors.New(
        - errors.Unwrap(
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocognit
          - goconst
          - mnd
          - nolintlint
          - revive
      - path: cmd/
        linters:
          - forbidigo

run:
  timeout: 10m
  concurrency: 4
  allow-parallel-runners: true

output:
  sort-results: true